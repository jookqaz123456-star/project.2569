<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หอพักสัมฤทธิ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>/* ตั้งธีมก่อนวาดหน้า (ใช้ค่าร่วมกับ user/admin ผ่าน localStorage เดียวกัน) */(function(){try{var t=localStorage.getItem('samrit_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<style>
:root{
  --bg:#0B0C10; --text:#E8EAF0; --card:#15171E; --sub:#6B7180; --sub2:#7C828F;
  --card-bd:rgba(255,255,255,0.08); --icon2-bg:rgba(255,255,255,0.06);
}
:root[data-theme="light"]{
  --bg:#eceef4; --text:#1b1e2a; --card:#ffffff; --sub:#667085; --sub2:#7b8291;
  --card-bd:rgba(0,0,0,0.08); --icon2-bg:rgba(0,0,0,0.05);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'IBM Plex Sans Thai',sans-serif;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s;}
</style>
</head>
<body>
<div style="text-align:center;padding:40px 24px;">
  <div style="width:60px;height:60px;border-radius:16px;background:linear-gradient(140deg,#7C5CE6,#5234B8);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 8px 24px rgba(108,79,216,0.4);">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M4 20V9l8-5 8 5v11" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><rect x="9" y="13" width="6" height="7" stroke="#fff" stroke-width="1.6"/></svg>
  </div>
  <h1 style="margin:0 0 6px;font-size:32px;font-weight:700;letter-spacing:-.5px;color:var(--text);">หอพักสัมฤทธิ์</h1>
  <p style="margin:0 0 40px;color:var(--sub);font:500 13px 'JetBrains Mono',monospace;letter-spacing:1px;">SAMRIT RESIDENCE MANAGEMENT SYSTEM</p>
  <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
    <a href="admin.html" style="display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid rgba(108,79,216,0.35);border-radius:16px;padding:20px 28px;text-decoration:none;color:var(--text);transition:all .15s;">
      <div style="width:44px;height:44px;border-radius:12px;background:rgba(108,79,216,0.2);display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="9" rx="1.5" stroke="#9D86F5" stroke-width="1.7"/><rect x="14" y="3" width="7" height="5" rx="1.5" stroke="#9D86F5" stroke-width="1.7"/><rect x="14" y="12" width="7" height="9" rx="1.5" stroke="#9D86F5" stroke-width="1.7"/><rect x="3" y="16" width="7" height="5" rx="1.5" stroke="#9D86F5" stroke-width="1.7"/></svg>
      </div>
      <div style="text-align:left;">
        <div style="font-weight:700;font-size:16px;">ระบบจัดการ</div>
        <div style="font-size:12.5px;color:var(--sub2);margin-top:2px;">สำหรับผู้ดูแลระบบ / เจ้าหน้าที่</div>
      </div>
    </a>
    <a href="user.html" style="display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-bd);border-radius:16px;padding:20px 28px;text-decoration:none;color:var(--text);transition:all .15s;">
      <div style="width:44px;height:44px;border-radius:12px;background:var(--icon2-bg);display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="#9AA0AE" stroke-width="1.7"/><path d="M5.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" stroke="#9AA0AE" stroke-width="1.7"/></svg>
      </div>
      <div style="text-align:left;">
        <div style="font-weight:700;font-size:16px;">พอร์ทัลผู้พักอาศัย</div>
        <div style="font-size:12.5px;color:var(--sub2);margin-top:2px;">สำหรับผู้เช่า / ผู้สนใจจองห้อง</div>
      </div>
    </a>
  </div>
</div>
<script>
function toggleTheme(){var r=document.documentElement;var cur=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',cur);try{localStorage.setItem('samrit_theme',cur);}catch(e){}var b=document.getElementById('themeBtn');if(b)b.textContent=cur==='light'?'🌙':'☀️';}
(function(){var b=document.createElement('button');b.id='themeBtn';b.type='button';b.title='สลับธีม สว่าง/มืด';b.onclick=toggleTheme;b.style.cssText='position:fixed;bottom:18px;right:18px;z-index:9999;width:44px;height:44px;border-radius:50%;border:1px solid var(--card-bd);background:var(--card);color:var(--text);font-size:19px;line-height:1;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center';b.textContent=(document.documentElement.getAttribute('data-theme')==='light')?'🌙':'☀️';document.body.appendChild(b);})();
</script>
</body>
</html>
